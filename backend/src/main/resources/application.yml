server:
  port: 8081

spring:
  application:
    name: api-doc-manager

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/api_doc_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: tang040929HXY#
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA 配置 - 自动建表
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # SQL 初始化配置
  sql:
    init:
      mode: embedded  # 只在首次启动时执行，数据库已有数据时会跳过
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

  # Jackson 配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# JWT 配置
jwt:
  secret: api-doc-manager-jwt-secret-key-2024-very-long-and-secure-key-for-production
  expiration: 86400000

# Springdoc OpenAPI 配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

# 日志配置
logging:
  level:
    root: INFO
    com.apidoc: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
